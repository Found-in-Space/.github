name: Bug report
description: Report a problem with a tool, application, or build.
body:
  - type: markdown
    attributes:
      value: |
        Use the repository that owns the affected tool. If you are unsure, ask in
        [Found-in-Space/.github](https://github.com/Found-in-Space/.github/issues).
        For vulnerabilities, use the [private security route](https://github.com/Found-in-Space/.github/blob/main/SECURITY.md).
        Remove secrets and private information from examples and logs.
  - type: textarea
    id: behaviour
    attributes:
      label: What happened, and what did you expect?
      description: Explain what you were trying to do and the result you saw.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Give steps, a small example, or a public page URL. Say if it happens intermittently or you cannot reproduce it yet.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Include the package version or commit, browser/runtime, operating system, and device when relevant. Say if the version is unknown.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Optional logs, screenshots, configuration excerpts, or dataset identifiers. Link large public artifacts instead of pasting them.
